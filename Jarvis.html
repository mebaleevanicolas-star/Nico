<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0a101f;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .gold-dust-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('gold-dust.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 1;
            opacity: 0.7;
        }

        .screen-container {
            width: 100vw;
            max-width: 100vw;
            height: 100vh;
            background: rgba(10, 20, 35, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 0;
            border: none;
            border-left: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            box-shadow: none;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .sidebar {
            width: 90px;
            background: rgba(10, 15, 25, 0.8);
            border-right: 1px solid rgba(212, 175, 55, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            gap: 25px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.3s;
            color: #f3e5ab;
            font-size: 0.75rem;
            text-align: center;
        }

        .nav-item.active, .nav-item:hover {
            opacity: 1;
        }

        .nav-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-item.active .nav-icon {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            border: 1px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 25px 35px;
        }

        .top-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-pill {
            background: rgba(15, 30, 60, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #f3e5ab;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .emotion-badges {
            display: flex;
            gap: 10px;
        }

        .badge {
            background: rgba(15, 30, 60, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge.active {
            background: rgba(30, 58, 138, 0.4);
            border-color: #d4af37;
            color: #f3e5ab;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            position: relative;
            gap: 30px;
        }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 100%;
        }

        .avatar-container {
            width: 320px;
            height: 420px;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }

        .avatar-container img.fade-out {
            opacity: 0;
            transform: scale(0.95);
        }

        .audio-wave {
            position: absolute;
            bottom: 15px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 15px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            z-index: 3;
        }

        .wave-line {
            width: 3px;
            height: 15px;
            background: #d4af37;
            border-radius: 2px;
            animation: pulseWave 1s infinite alternate;
        }
        .wave-line:nth-child(2) { animation-delay: 0.2s; height: 25px; }
        .wave-line:nth-child(3) { animation-delay: 0.4s; height: 35px; }
        .wave-line:nth-child(4) { animation-delay: 0.1s; height: 20px; }
        .wave-line:nth-child(5) { animation-delay: 0.3s; height: 12px; }

        @keyframes pulseWave {
            0% { transform: scaleY(0.4); }
            100% { transform: scaleY(1); }
        }

        .chat-section {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 10px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            padding: 15px;
        }

        .chat-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(10, 20, 35, 0.75), rgba(10, 20, 35, 0.75)), url('gold-dust.gif.gif');
            background-size: cover;
            background-position: center;
            z-index: 1;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .score-board, .messages-container, .input-bar {
            position: relative;
            z-index: 2;
        }

        .score-board {
            display: none;
            background: rgba(20, 40, 80, 0.75);
            border: 1px solid #d4af37;
            padding: 8px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #f3e5ab;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(5px);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 10px;
            max-height: 350px;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 5px;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 10px;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .message.jarvis {
            background: rgba(15, 35, 75, 0.9);
            backdrop-filter: blur(5px);
            border: 1px solid #d4af37;
            color: #f3e5ab;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 10px rgba(212, 175, 55, 0.15);
        }

        .message.jarvis .j-avatar-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            border: 1px solid #d4af37;
            color: #f3e5ab;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 6px 0;
            align-items: center;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: #d4af37;
            border-radius: 50%;
            opacity: 0.4;
            animation: blink 1.4s infinite both;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.4; transform: scale(1); }
        }

        .input-bar {
            background: rgba(15, 30, 60, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid #d4af37;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 8px 8px 8px 20px;
            margin-top: 15px;
            gap: 10px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        }

        .input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Montserrat', sans-serif;
        }

        .input-bar input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .marble-field {
            background: rgba(10, 20, 40, 0.6);
            border: 1px solid #d4af37 !important;
            border-radius: 20px;
            padding: 6px 12px;
            color: #fff;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
            text-align: center;
        }

        .send-btn {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: #f3e5ab;
            border: 1px solid #d4af37;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .send-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #f3e5ab;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }

        .icon-btn:hover {
            opacity: 1;
            color: #fff;
            transform: scale(1.05);
        }

        .icon-btn.listening {
            opacity: 1;
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.15);
            border-radius: 50%;
            animation: micPulse 1s infinite;
        }

        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }
    </style>
</head>
<body>

    <div class="gold-dust-bg"></div>

    <div class="screen-container">
        <div class="sidebar">
            <div class="nav-item active" onclick="switchMode('chat')" id="nav-chat">

                <span>Chat</span>
            </div>

            <div class="workspace">

                            <div class="wave-line"></div>

                </div>

                <div class="chat-section">
                    <div class="score-board" id="score-board">
                        <span id="score-label-1">Score - Toi : <b id="score-user">0</b></span>
                        <span id="score-label-2">Jarvis : <b id="score-jarvis">0</b></span>
                    </div>

                    <div class="messages-container" id="messages-container">
                        <div class="message jarvis">
                            <div class="j-avatar-icon">J</div>
                            <div>Bienvenue sur Nico.AI 🤖<br>Que veux-tu faire aujourd'hui ?<br><b>Tape :</b><br>• <b>a</b> pour Discuter 💬<br>• <b>b</b> pour Calculer 🧮<br>• <b>c</b> pour Jouer (Games) 🎲</div>
                        </div>
                    </div>

                    <div class="input-bar" id="input-bar-container">
                        <input type="text" id="user-input" placeholder="Tape ta réponse ici..." autofocus onkeypress="handleKeyPress(event)">
                        
                        <input type="text" id="marble-bet-input" class="marble-field" placeholder="Billes" maxlength="4" style="display:none; width: 90px;" oninput="validateMarbleBet(this)" onkeypress="handleMarbleGuessKeyPress(event)">
                        <input type="text" id="marble-guess-input" class="marble-field" placeholder="pair / impair" style="display:none; width: 120px;" onkeypress="handleMarbleGuessKeyPress(event)">

                        <button class="icon-btn" id="mic-btn" title="Activer/désactiver le micro" onclick="toggleMic()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                                <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                                <line x1="12" y1="19" x2="12" y2="22"></line>
                            </svg>
                        </button>

    </div>

    <audio autoplay loop>
        <source src="Glass_and_Cedar.mp3" type="audio/mpeg">
        Votre navigateur ne supporte pas l'élément audio.
    </audio>

    <script>
        const EXPRESSIONS = {
            thinking: "JA3.jfif",
            happy: "JA1.jfif",
            sad: "JA2.jfif",
            surprised: "JA4.jfif",
            confident: "match nul.jfif", 
            annoyed: "tu as gagné.jfif",   
            sly: "perdu.jfif"        
        };

        let currentMode = 'home';
        let chatStep = 'menu';
        
        let userData = {
            name: '',
            age: null,
            state: '',
            food: '',
            calcSub: '',
            calcOp: '',
            calcNum1: null,
            userScore: 0,
            jarvisScore: 0,
            userMarbles: 10,
            jarvisMarbles: 10,
            marbleTurn: 'user_guess',
            savedInfo: null,
            savedKeyword: null,
            pendingQuestion: null
        };

        /* ============================================================
           MEMOIRE INTERNE DE JARVIS
           Quand Jarvis ne comprend pas une question, elle la mémorise.
           Si l'utilisateur lui explique, elle enregistre l'explication
           dans le localStorage (mémoire persistante entre les sessions)
           et pourra donc répondre correctement si la même question
           (ou une question très proche) est reposée plus tard.
        ============================================================ */
        let jarvisMemory = {};

        function loadMemory() {
            try {
                const stored = localStorage.getItem('jarvisMemory');
                jarvisMemory = stored ? JSON.parse(stored) : {};
            } catch (e) {
                jarvisMemory = {};
            }
        }

        function persistMemory() {
            try {
                localStorage.setItem('jarvisMemory', JSON.stringify(jarvisMemory));
            } catch (e) {
                console.warn("Impossible d'enregistrer la mémoire de Jarvis :", e);
            }
        }

        function normalizeKey(str) {
            return str
                .toLowerCase()
                .trim()
                .replace(/[?!.,;:'"]/g, '')
                .replace(/\s+/g, ' ');
        }

        function saveToMemory(question, explanation) {
            const key = normalizeKey(question);
            if (!key) return;
            jarvisMemory[key] = explanation;
            persistMemory();
        }

        function findInMemory(userMessage) {
            const normMsg = normalizeKey(userMessage);
            if (!normMsg) return null;

            if (jarvisMemory[normMsg]) return jarvisMemory[normMsg];

            let bestMatch = null;
            let bestLength = 0;
            for (const key in jarvisMemory) {
                if (normMsg.includes(key) || key.includes(normMsg)) {
                    if (key.length > bestLength) {
                        bestLength = key.length;
                        bestMatch = jarvisMemory[key];
                    }
                }
            }
            return bestMatch;
        }

        loadMemory();

        /* ============================================================
           OUVERTURE AUTOMATIQUE DE SITES SELON DES MOTS-CLES
        ============================================================ */
        const LINK_KEYWORDS = [
            { keywords: ['youtube'], url: 'https://www.youtube.com', name: 'YouTube' },
            { keywords: ['whatsapp web', 'whatsapp wep', 'whatsapp'], url: 'https://web.whatsapp.com', name: 'WhatsApp Web' },
            { keywords: ['google'], url: 'https://www.google.com', name: 'Google' },
            { keywords: ['instagram', 'intagram'], url: 'https://www.instagram.com', name: 'Instagram' },
            { keywords: ['facebook'], url: 'https://www.facebook.com', name: 'Facebook' },
            { keywords: ['gmail'], url: 'https://mail.google.com', name: 'Gmail' }
        ];

        function checkForLinkKeywords(rawVal) {
            const lower = rawVal.toLowerCase();
            for (const entry of LINK_KEYWORDS) {
                for (const kw of entry.keywords) {
                    if (lower.includes(kw)) {
                        window.open(entry.url, '_blank');
                        jarvisReplyWithDelay(`C'est parti, je t'ouvre ${entry.name} dans un nouvel onglet ! 🚀`, 'happy', '😊 Happy');
                        return true;
                    }
                }
            }
            return false;
        }

        /* ============================================================================
           BASE DE CONNAISSANCES ENRICHIE DE JARVIS
           (Histoire, Géographie, Sport, Technologie/IA)
           + reconnaissance de variantes de formulation ("Qui est Messi ?",
             "C'est qui Messi ?", "Tu connais Messi ?" sont reconnues comme
             la même question, peu importe la casse ou les accents).
        ============================================================================ */

        // Normalisation "large" : minuscules, sans accents, sans ponctuation.
        function normalizeText(str) {
            return str
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // supprime les accents
                .toLowerCase()
                .replace(/['’\-]/g, ' ') // apostrophes et tirets deviennent des espaces
                .replace(/[?!.,;:"()]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // Accorde "de/du/de la/des" + le nom d'un pays affiché (ex: "le Gabon" -> "du Gabon")
        function withDe(display) {
            if (display.startsWith('le ')) return 'du ' + display.slice(3);
            if (display.startsWith('les ')) return 'des ' + display.slice(4);
            if (display.startsWith('la ')) return 'de la ' + display.slice(3);
            if (display.startsWith("l'") || display.startsWith('l’')) return 'de ' + display;
            return 'de ' + display;
        }

        // Accorde "en/au/aux" + le nom d'un pays affiché (ex: "le Gabon" -> "au Gabon")
        function withEnAu(display) {
            if (display.startsWith('le ')) return 'au ' + display.slice(3);
            if (display.startsWith('les ')) return 'aux ' + display.slice(4);
            if (display.startsWith('la ')) return 'en ' + display.slice(3);
            if (display.startsWith("l'") || display.startsWith('l’')) return 'en ' + display.slice(2);
            return 'en ' + display;
        }

        // Retire un article de tête ("le ", "la ", "les ", "l ", "du ", "des "...)
        function stripLeadingArticle(str) {
            return str.replace(/^(de la |de l |des |du |le |la |les |l |de )/, '').trim();
        }

        /* ---------- PERSONNAGES & ENTITÉS (Histoire, Science, Sport, Tech) ---------- */
        const ENTITY_DB = {
            // --- Histoire ---
            einstein: { aliases: ['einstein', 'albert einstein'], bio: "Albert Einstein (1879-1955) était un physicien allemand naturalisé suisse et américain. Il a développé la théorie de la relativité et a reçu le prix Nobel de physique en 1921. Il est considéré comme l'un des plus grands génies scientifiques de l'Histoire. 🧠⚛️", emotion: 'confident', label: '😎 Confidente' },

        /* ============================================================
           RECONNAISSANCE VOCALE (MICRO)
           Un clic active le micro, un second clic le désactive.
           La voix est convertie en texte, injectée dans le champ de
           saisie puis envoyée automatiquement à Jarvis.
        ============================================================ */
        let recognition = null;
        let isListening = false;

        function getSpeechRecognitionAPI() {
            return window.SpeechRecognition || window.webkitSpeechRecognition || null;
        }

        function initSpeechRecognition() {
            const SpeechRecognitionAPI = getSpeechRecognitionAPI();
            if (!SpeechRecognitionAPI) return null;

            const rec = new SpeechRecognitionAPI();
            rec.lang = 'fr-FR';
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            rec.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                const inputField = document.getElementById('user-input');
                if (inputField) {
                    inputField.value = transcript;
                }
                stopListening();
                processInput();
            };

            rec.onerror = function(event) {
                console.warn('Erreur reconnaissance vocale :', event.error);
                stopListening();
            };

            rec.onend = function() {
                if (isListening) {
                    stopListening();
                }
            };

            return rec;
        }

        function toggleMic() {
            const SpeechRecognitionAPI = getSpeechRecognitionAPI();
            if (!SpeechRecognitionAPI) {
                alert("Désolé, la reconnaissance vocale n'est pas supportée par ce navigateur. Essaie avec Google Chrome sur ordinateur ou Android.");
                return;
            }

            if (!recognition) {
                recognition = initSpeechRecognition();
            }

            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        function startListening() {
            if (!recognition) return;
            try {
                recognition.start();
                isListening = true;
                const micBtn = document.getElementById('mic-btn');
                const inputField = document.getElementById('user-input');
                if (micBtn) micBtn.classList.add('listening');
                if (inputField) inputField.placeholder = "Je t'écoute... parle maintenant 🎙️";
            } catch (e) {
                console.warn('Impossible de démarrer le micro :', e);
            }
        }

        function stopListening() {
            if (recognition) {
                try { recognition.stop(); } catch (e) { /* déjà arrêté */ }
            }
            isListening = false;
            const micBtn = document.getElementById('mic-btn');
            const inputField = document.getElementById('user-input');
            if (micBtn) micBtn.classList.remove('listening');
            if (inputField) inputField.placeholder = 'Tape ta réponse ici...';
        }

        function getSmartJarvisBet(maxAvailable) {
            if (maxAvailable <= 1) return 1;
            let rand = Math.random();
            if (rand < 0.6) {
                return Math.floor(Math.random() * Math.min(3, maxAvailable)) + 1;
            } else {
                return Math.floor(Math.random() * Math.min(5, maxAvailable)) + 1;
            }
        }

        function processMarbleUserGuessTurn() {
            const betInput = document.getElementById('marble-bet-input');
            const guessInput = document.getElementById('marble-guess-input');
            const betVal = parseInt(betInput.value, 10);
            const guessVal = guessInput.value.trim().toLowerCase();

            if (isNaN(betVal) || betVal < 1 || betVal > userData.userMarbles) {
                alert(`Entre un nombre de billes valide entre 1 et ${userData.userMarbles} (ton stock actuel) !`);
                return;
            }
            if (guessVal !== 'pair' && guessVal !== 'impair') {
                alert("Tu dois écrire explicitement 'pair' ou 'impair' !");
                return;
            }

            appendMessage('user', `Je parie ${betVal} billes et je dis ${guessVal}.`);
            betInput.value = '';
            guessInput.value = '';

            let jarvisMax = Math.min(10, userData.jarvisMarbles);
            let jarvisHidden;
            if (userData.userMarbles === 1) {
                let possibleImpaire = [];
                for (let i = 1; i <= jarvisMax; i += 2) {
                    possibleImpaire.push(i);
                }
                if (possibleImpaire.length > 0) {
                    jarvisHidden = possibleImpaire[Math.floor(Math.random() * possibleImpaire.length)];
                } else {
                    jarvisHidden = 1;
                }
            } else {
                jarvisHidden = Math.floor(Math.random() * jarvisMax) + 1;
            }

            let isEven = (jarvisHidden % 2 === 0);
            let actualParity = isEven ? 'pair' : 'impair';

            let responseText = `J'avais caché ${jarvisHidden} billes (${actualParity}). `;
            let emotion = 'happy';
            let label = '😊 Happy';

            if (guessVal === actualParity) {
                userData.userMarbles += jarvisHidden;
                userData.jarvisMarbles = Math.max(0, userData.jarvisMarbles - jarvisHidden);
                responseText += `Bien joué ! Tu as deviné juste, tu récupères mes ${jarvisHidden} billes cachées (+${jarvisHidden}).`;
                emotion = 'annoyed';
                label = '😤 Agacée';
            } else {
                userData.userMarbles = Math.max(0, userData.userMarbles - betVal);
                userData.jarvisMarbles += betVal;
                responseText += `Zut, tu t'es trompé ! Je récupère tes ${betVal} billes pariées (-${betVal} pour toi). Dommage ! 😈`;
                emotion = 'sly';
                label = '😏 Sournoise';
            }

            updateMarbleScores();

            if (userData.userMarbles <= 0) {
                jarvisReplyWithDelay(responseText + "<br><br><b>Victoire finale pour moi ! Tu n'as plus de billes. Game Over ! 😈</b>", 'sly', '😏 Sournoise');
                currentMode = 'game_menu';
                updateInputsVisibility();
                return;
            } else if (userData.jarvisMarbles <= 0) {
                jarvisReplyWithDelay(responseText + "<br><br><b>Félicitations ! Tu m'as pris toutes mes billes, tu gagnes la partie ! 🎉🏆</b>", 'annoyed', '😤 Agacée');
                currentMode = 'game_menu';
                updateInputsVisibility();
                return;
            }

            userData.marbleTurn = 'jarvis_guess';
            updateInputsVisibility();

            jarvisReplyWithDelay(responseText + "<br><br>C'est maintenant à mon tour de deviner ! Tape un nombre de billes que tu caches :", emotion, label);
        }
